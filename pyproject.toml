[project]
name = "payguard-drift"
version = "1.0.0"
description = "TP autonome CISIA — Data drift & métriques (module 31) : détection de fraude PayGuard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Bonus étape 8 (facultatif) — même famille de version que le lock InduSense :
evidently = ["evidently>=0.7,<0.8"]
[tool.uv]
# Projet « virtuel » : uv installe les dépendances sans packager le TP lui-même.
package = false
